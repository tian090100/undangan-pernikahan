<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1900" viewBox="0 0 2600 1900">
  <defs>
    <style>
      .bg{fill:#e9e7e1}.frame{fill:#fffdf8;stroke:#d4cec0;stroke-width:2}.dark{fill:#101713}.paper{fill:#eee8dc}.gold{fill:#c7a96b}.sage{fill:#56675b}.muted{fill:#797d77}.white{fill:#fff}.line{stroke:#c7a96b;stroke-width:2}.grid{stroke:#c7a96b;stroke-width:1;opacity:.15}.display{font-family:Georgia,serif;font-weight:400}.body{font-family:Arial,sans-serif}.label{font-family:Arial,sans-serif;font-size:12px;letter-spacing:2px}.title{font-family:Georgia,serif;font-size:42px}.h2{font-family:Georgia,serif;font-size:28px}.copy{font-family:Arial,sans-serif;font-size:13px}.tiny{font-family:Arial,sans-serif;font-size:10px}.radius{rx:16}.image{fill:#c9cec8}.image2{fill:#929e94}.dash{fill:none;stroke:#9d968a;stroke-width:2;stroke-dasharray:7 7}
    </style>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26332b"/><stop offset="1" stop-color="#738071"/></linearGradient>
  </defs>
  <rect class="bg" width="2600" height="1900"/>

  <!-- Workspace title -->
  <text x="70" y="80" class="body" font-size="18" font-weight="bold" fill="#101713">DAPRITA · WEDDING INVITATION WORKSPACE</text>
  <text x="70" y="110" class="copy muted">Starter canvas · Foundations · Components · Mobile · Desktop</text>

  <!-- Foundations -->
  <g id="01-Foundations" transform="translate(70 160)">
    <rect class="frame" width="520" height="510" rx="20"/>
    <text x="30" y="46" class="label sage">01 · FOUNDATIONS</text>
    <text x="30" y="92" class="title dark">Luxury Garden</text>
    <text x="30" y="124" class="copy muted">Color, typography, spacing, and visual direction.</text>
    <text x="30" y="170" class="label muted">COLOR STYLES</text>
    <rect x="30" y="190" width="90" height="82" rx="10" class="dark"/><rect x="130" y="190" width="90" height="82" rx="10" class="sage"/><rect x="230" y="190" width="90" height="82" rx="10" class="gold"/><rect x="330" y="190" width="90" height="82" rx="10" class="paper"/>
    <text x="30" y="292" class="tiny muted">#101713</text><text x="130" y="292" class="tiny muted">#56675B</text><text x="230" y="292" class="tiny muted">#C7A96B</text><text x="330" y="292" class="tiny muted">#EEE8DC</text>
    <text x="30" y="335" class="label muted">TYPOGRAPHY</text>
    <text x="30" y="382" class="display dark" font-size="38">Saskia &amp; Rizky</text>
    <text x="30" y="413" class="body muted" font-size="14">Manrope · Body / 14 / Regular</text>
    <text x="30" y="455" class="label muted">SPACING SCALE</text>
    <g transform="translate(30 475)" class="gold"><rect width="4" height="12"/><rect x="18" width="8" height="12"/><rect x="40" width="12" height="12"/><rect x="66" width="16" height="12"/><rect x="96" width="24" height="12"/><rect x="134" width="32" height="12"/><rect x="180" width="48" height="12"/></g>
  </g>

  <!-- Components -->
  <g id="02-Components" transform="translate(620 160)">
    <rect class="frame" width="560" height="510" rx="20"/>
    <text x="30" y="46" class="label sage">02 · COMPONENTS</text>
    <text x="30" y="91" class="h2 dark">Reusable UI Kit</text>
    <rect x="30" y="125" width="210" height="48" class="dark" rx="2"/><text x="52" y="155" class="label white">BUKA UNDANGAN  ↗</text>
    <rect x="260" y="125" width="210" height="48" fill="none" stroke="#101713"/><text x="286" y="155" class="label dark">LIHAT LOKASI  ↗</text>
    <g transform="translate(30 205)"><rect width="112" height="95" class="paper" rx="10"/><text x="56" y="43" text-anchor="middle" class="h2 dark">128</text><text x="56" y="69" text-anchor="middle" class="tiny muted">DAYS</text></g>
    <g transform="translate(154 205)"><rect width="112" height="95" class="paper" rx="10"/><text x="56" y="43" text-anchor="middle" class="h2 dark">08</text><text x="56" y="69" text-anchor="middle" class="tiny muted">HOURS</text></g>
    <g transform="translate(286 205)"><rect width="240" height="200" class="dark" rx="12"/><text x="20" y="32" class="label" fill="#c7a96b">WEDDING GIFT</text><text x="20" y="100" class="display white" font-size="24">1234 5678 901</text><text x="20" y="128" class="tiny" fill="#bdc4be">SASKIA ADELINE</text><line x1="20" y1="165" x2="132" y2="165" class="line"/><text x="20" y="157" class="tiny white">SALIN NOMOR</text></g>
    <g transform="translate(30 330)"><rect width="235" height="75" fill="#f7f3e9" stroke="#d9d2c4" rx="12"/><text x="16" y="27" class="body dark" font-size="13" font-weight="bold">Nadia Putri</text><text x="16" y="51" class="tiny muted">Semoga selalu bahagia bersama.</text></g>
    <text x="30" y="446" class="label muted">FORM FIELD</text><line x1="30" y1="482" x2="525" y2="482" stroke="#9d968a"/><text x="30" y="474" class="copy muted">Tuliskan nama Anda</text>
  </g>

  <!-- Mobile cover -->
  <g id="03-Mobile-Cover" transform="translate(1220 160)">
    <text x="0" y="-18" class="label muted">MOBILE · 390 × 844 · COVER</text>
    <rect class="frame" width="390" height="844" rx="24"/>
    <rect x="0" y="0" width="390" height="844" rx="24" fill="url(#hero)"/>
    <rect x="14" y="14" width="362" height="816" rx="15" fill="none" stroke="#c7a96b" opacity=".7"/>
    <text x="195" y="190" text-anchor="middle" class="label white">THE WEDDING CELEBRATION OF</text>
    <text x="195" y="285" text-anchor="middle" class="display white" font-size="51">Saskia</text><text x="195" y="342" text-anchor="middle" class="display gold" font-size="38">&amp;</text><text x="195" y="402" text-anchor="middle" class="display white" font-size="51">Rizky</text>
    <line x1="145" y1="445" x2="245" y2="445" class="line"/><text x="195" y="480" text-anchor="middle" class="label white">12 · 12 · 2026</text>
    <text x="195" y="555" text-anchor="middle" class="tiny" fill="#d8ded9">KEPADA YTH.</text><text x="195" y="583" text-anchor="middle" class="display white" font-size="20">Tamu Istimewa</text>
    <rect x="102" y="630" width="186" height="48" class="gold"/><text x="195" y="659" text-anchor="middle" class="label dark">BUKA UNDANGAN ↗</text>
  </g>

  <!-- Mobile content -->
  <g id="04-Mobile-Content" transform="translate(1640 160)">
    <text x="0" y="-18" class="label muted">MOBILE · 390 × 844 · CONTENT</text>
    <rect class="frame" width="390" height="844" rx="24"/>
    <rect x="0" y="0" width="390" height="390" rx="24" class="image2"/>
    <text x="20" y="425" class="label sage">TOGETHER WITH OUR FAMILIES</text><text x="20" y="493" class="display dark" font-size="47">Saskia &amp;</text><text x="20" y="545" class="display dark" font-size="47">Rizky</text>
    <text x="20" y="585" class="copy muted">Dengan penuh syukur dan sukacita, kami</text><text x="20" y="605" class="copy muted">mengundang Anda menjadi bagian dari awal</text><text x="20" y="625" class="copy muted">perjalanan kami.</text>
    <g transform="translate(20 675)"><rect width="78" height="82" class="paper" rx="10"/><rect x="88" width="78" height="82" class="paper" rx="10"/><rect x="176" width="78" height="82" class="paper" rx="10"/><rect x="264" width="78" height="82" class="paper" rx="10"/><text x="39" y="35" text-anchor="middle" class="h2">128</text><text x="127" y="35" text-anchor="middle" class="h2">08</text><text x="215" y="35" text-anchor="middle" class="h2">42</text><text x="303" y="35" text-anchor="middle" class="h2">12</text></g>
  </g>

  <!-- Desktop -->
  <g id="05-Desktop-Hero" transform="translate(70 1040)">
    <text x="0" y="-18" class="label muted">DESKTOP · 1440 × 760 · HERO</text>
    <rect class="frame" width="1440" height="760" rx="18"/>
    <rect width="835" height="760" rx="18" class="image2"/><rect x="835" width="605" height="760" rx="18" class="dark"/>
    <text x="890" y="70" class="display white" font-size="22">S&amp;R</text><text x="1335" y="70" class="label white">BAGIKAN ↗</text>
    <text x="905" y="230" class="label gold">TOGETHER WITH OUR FAMILIES</text><text x="900" y="335" class="display white" font-size="72">Saskia</text><text x="900" y="415" class="display gold" font-size="64">&amp; Rizky</text>
    <text x="905" y="480" class="copy" fill="#bdc4be">Dengan penuh syukur dan sukacita, kami mengundang</text><text x="905" y="504" class="copy" fill="#bdc4be">Anda menjadi bagian dari awal perjalanan kami.</text>
    <line x1="905" y1="570" x2="950" y2="570" class="line"/><text x="970" y="574" class="label white">JAKARTA · 12 DESEMBER 2026</text>
    <g opacity=".25"><line x1="80" y1="0" x2="80" y2="760" class="grid"/><line x1="200" y1="0" x2="200" y2="760" class="grid"/><line x1="320" y1="0" x2="320" y2="760" class="grid"/><line x1="440" y1="0" x2="440" y2="760" class="grid"/><line x1="560" y1="0" x2="560" y2="760" class="grid"/><line x1="680" y1="0" x2="680" y2="760" class="grid"/><line x1="800" y1="0" x2="800" y2="760" class="grid"/><line x1="920" y1="0" x2="920" y2="760" class="grid"/><line x1="1040" y1="0" x2="1040" y2="760" class="grid"/><line x1="1160" y1="0" x2="1160" y2="760" class="grid"/><line x1="1280" y1="0" x2="1280" y2="760" class="grid"/><line x1="1360" y1="0" x2="1360" y2="760" class="grid"/></g>
  </g>

  <!-- Handoff checklist -->
  <g id="06-Handoff" transform="translate(1550 1040)">
    <rect class="frame" width="700" height="610" rx="20"/>
    <text x="35" y="52" class="label sage">06 · HANDOFF CHECKLIST</text><text x="35" y="104" class="title dark">Ready for Development</text>
    <g class="copy muted"><text x="70" y="165">Frame mobile dan desktop tersedia</text><text x="70" y="215">Font dan color styles sudah diberi nama</text><text x="70" y="265">Semua foto tersedia di halaman Assets</text><text x="70" y="315">Interaksi prototype diberi catatan</text><text x="70" y="365">State form, musik, dan lightbox tersedia</text><text x="70" y="415">Spacing memakai skala yang konsisten</text><text x="70" y="465">Teks tidak di-flatten atau outline</text></g>
    <g fill="none" stroke="#c7a96b" stroke-width="2"><circle cx="48" cy="160" r="9"/><circle cx="48" cy="210" r="9"/><circle cx="48" cy="260" r="9"/><circle cx="48" cy="310" r="9"/><circle cx="48" cy="360" r="9"/><circle cx="48" cy="410" r="9"/><circle cx="48" cy="460" r="9"/></g>
    <rect x="35" y="515" width="630" height="58" class="paper" rx="10"/><text x="55" y="550" class="copy dark">Tip: gunakan Auto Layout dan Components sebelum desain diserahkan.</text>
  </g>

  <text x="70" y="1840" class="tiny muted">DAPRITA · Figma starter workspace · Import SVG, then convert each named group to a native frame.</text>
</svg>
